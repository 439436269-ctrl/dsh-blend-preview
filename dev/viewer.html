<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>dsh-blend-preview · viewer harness</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0f16; color: #e8edf5; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
      main { display: flex; flex-direction: column; height: 100%; }
      header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
      header b { margin-right: auto; font-weight: 600; }
      button { background: rgba(255,255,255,.08); color: inherit; border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer; font: inherit; }
      button[aria-pressed="true"] { background: rgba(84,140,255,.28); color: #bcd2ff; }
      #stage { position: relative; flex: 1; min-height: 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; background: radial-gradient(120% 100% at 50% 0%, #2a3446 0%, #141a24 55%, #0b0f16 100%); }
      #stats { position: absolute; left: 12px; top: 12px; font-size: 11px; opacity: .7; pointer-events: none; }
      #error { position: absolute; inset: 0; display: none; place-items: center; color: #ff9b9b; padding: 24px; text-align: center; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <b>plate_rack_base.blend</b>
        <button id="reset">重置视角</button>
        <button id="wire" aria-pressed="false">线框</button>
        <button id="spin" aria-pressed="false">自动旋转</button>
      </header>
      <div id="stage">
        <canvas id="view" tabindex="0"></canvas>
        <div id="stats"></div>
        <div id="error"></div>
      </div>
    </main>
    <script>
      // Minimal loader shim: the real shell evaluates plugin bundles as
      // window.__ModuleLoader__.load({id, factory}) and materializes them later.
      window.__ModuleLoader__ = { load: (registration) => { window.__REGISTRATION__ = registration; } };
    </script>
    <script src="../lib/client.js"></script>
    <script>
      (async () => {
        const canvas = document.getElementById("view");
        const stats = document.getElementById("stats");
        const error = document.getElementById("error");
        try {
          const module = window.__REGISTRATION__.factory((name) => (name === "react" ? {} : {}));
          const viewer = module.__createViewer(canvas, {});
          const [glb, scene] = await Promise.all([
            fetch("./model.glb").then((r) => { if (!r.ok) throw new Error(`GLB ${r.status}`); return r.arrayBuffer(); }),
            fetch("./scene.json").then((r) => { if (!r.ok) throw new Error(`scene ${r.status}`); return r.json(); }),
          ]);
          const t0 = performance.now();
          const result = viewer.setModel(glb);
          const ms = Math.round(performance.now() - t0);
          const size = result.bounds.max.map((v, i) => (v - result.bounds.min[i]).toFixed(3));
          stats.textContent = `${result.nodes} nodes · ${result.triangles.toLocaleString()} tris · ${size.join(" × ")} m · parse ${ms} ms · scene: ${scene.counts.triangles} tris`;
          window.__ready = true;
          window.__stats = result;
          document.getElementById("reset").onclick = () => viewer.resetView();
          document.getElementById("wire").onclick = (event) => {
            const next = !viewer.isWireframe();
            viewer.setWireframe(next);
            event.currentTarget.setAttribute("aria-pressed", String(next));
          };
          document.getElementById("spin").onclick = (event) => {
            const next = !viewer.isAutoRotate();
            viewer.setAutoRotate(next);
            event.currentTarget.setAttribute("aria-pressed", String(next));
          };
        } catch (problem) {
          error.style.display = "grid";
          error.textContent = String(problem && problem.stack ? problem.stack : problem);
          window.__error = String(problem);
        }
      })();
    </script>
  </body>
</html>
